# Release / publish workflow: dual-registry npm release + GitHub Release.
#
# Manual trigger only (Actions tab -> "Publish to Registries" -> Run
# workflow). Builds the wasm pkg from source (wasm-pack + pinned
# wasm-opt/binaryen, same as the local `npm run build:wasm` recipe),
# bumps demo/package.json to the requested version, runs the FULL gate
# (Rust suite + all JS faces incl. REPL + 42/42 air E2E + 16/16 browser),
# then publishes demo/ to npmjs.org AND GitHub Packages, and cuts a tag
# + GitHub Release.
#
# Package names:
#   npmjs.org:       microbit-emu                (demo/package.json)
#   GitHub Packages: @danish9661/microbit-emu
#
# Required repo secrets: NPM_TOKEN (npmjs automation token).
# GITHUB_TOKEN is provided automatically (packages:write + contents:write).
name: Publish to Registries

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to publish from'
        required: true
        type: choice
        options:
          - master
      version:
        description: 'Version to publish (e.g. 1.2.0)'
        required: true
        type: string
      description:
        description: 'Release notes'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    # NOTE: no defaults.run.working-directory here on purpose. It applies
    # to EVERY run step including the first one, but `demo/` does not
    # exist until the Checkout step creates the workspace — so the very
    # first step failed with "No such file or directory". Each step that
    # needs demo/ declares its own `working-directory: demo` below.
    steps:
      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must match x.y.z pattern (e.g. 1.2.0)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - name: Install binaryen (pinned wasm-opt)
        run: |
          curl -sL -o /tmp/be.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz
          tar xzf /tmp/be.tar.gz -C /tmp
          echo "/tmp/binaryen-version_132/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        # test:ts / test:ts-example / test:arrow-ts run .mts via
        # --experimental-strip-types (needs Node >= 22.6); Node 20
        # fails with "bad option" (exit 9). Keep CI on the same
        # major the test chain is proven on locally.
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: demo
        run: npm ci

      - name: Build WASM package
        working-directory: demo
        env:
          RUSTFLAGS: "--remap-path-prefix=/home/runner=/build"
        run: npm run build:wasm

      - name: Build handshake test package
        # test:wasm opens with test:handshake, which imports the wasm
        # from demo/parts/pkg-test-handshake — a gitignored build
        # output that a fresh checkout does not have. Build it here
        # (same crate, second out-dir) before running the suite.
        working-directory: demo
        env:
          RUSTFLAGS: "--remap-path-prefix=/home/runner=/build"
        run: npm run build:handshake

      - name: Set package version
        working-directory: demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CURRENT=$(node -p "require('./package.json').version")
          # The version may already be bumped in the tree; npm errors on
          # a no-op `npm version`, so only bump when it actually differs.
          if [ "$CURRENT" != "${{ inputs.version }}" ]; then
            npm version ${{ inputs.version }} --no-git-tag-version
            git add package.json
            git commit -m "v${{ inputs.version }}"
          else
            echo "package.json already at ${{ inputs.version }}, skipping version bump"
          fi

      - name: Run test suite
        working-directory: demo
        run: npm run test:wasm

      - name: Live BLE E2E over air bridge
        # The 42-check live suite needs the Bumble bridge process beside
        # the Node runner (pinned deps match local 4/4-green runs). The
        # bridge is loopback-local (LocalLink, no radio hardware).
        # --break-system-packages: stock ubuntu-latest python is PEP 668
        # managed; this is a disposable CI container, user installs only.
        working-directory: demo
        run: |
          python3 --version
          pip install --break-system-packages "bumble==0.0.231" "websockets==16.0"
          python3 ../tools/ble_air_bridge.py --port 18771 &
          BRIDGE_PID=$!
          sleep 8
          node parts/ble_live_e2e.mjs ws://127.0.0.1:18771
          STATUS=$?
          kill $BRIDGE_PID 2>/dev/null || true
          exit $STATUS

      - name: Run Rust suite
        run: cargo test --manifest-path nrf52833-periph-wasm/Cargo.toml -- --test-threads=1

      - name: Publish to npmjs.org
        working-directory: demo
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Node.js for GitHub Packages
        # Same Node major as above (kept in sync; avoids any future
        # publish-time script hitting the missing type-stripping flag).
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'

      - name: Publish to GitHub Packages
        working-directory: demo
        run: |
          npm pkg set name="@danish9661/microbit-emu"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DESC: ${{ inputs.description || format('Release v{0}', inputs.version) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          echo "$RELEASE_DESC" > /tmp/release-notes.txt
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --target "${{ inputs.branch }}" \
            --notes-file /tmp/release-notes.txt
