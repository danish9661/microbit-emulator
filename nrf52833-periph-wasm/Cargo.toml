[workspace]

[package]
name = "nrf52833-periph-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
wasm-bindgen = "0.2"
log = "0.4"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
svd-parser = "0.13"
aes = "0.9"
p256 = { version = "0.14.0", default-features = false, features = ["alloc", "arithmetic", "ecdh"] }
cmac = "0.8.0"
cipher = "0.5"
getrandom = { version = "0.4", features = ["wasm_js"] }

