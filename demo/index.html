<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>micro:bit v2.2 emulator (nRF52833)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  #matrix { display: grid; grid-template-columns: repeat(5, 44px); gap: 6px; margin: 1rem 0; }
  .led { width: 44px; height: 44px; border-radius: 6px; background: #222; }
  .led.on { background: #f00; box-shadow: 0 0 12px #f00; }
  button { font-size: 1rem; margin-right: .5rem; }
  #uart { width: 100%; height: 140px; font-family: monospace; }
  #status { color: #555; }
</style>
</head>
<body>
<h1>micro:bit v2.2 emulator <small>(nRF52833 target only)</small></h1>
<p>Drop a <code>.hex/.bin</code> built for flash <code>0x0</code> (ARM GCC, no SoftDevice).
Interface MCU (DAPLink) is <em>not</em> emulated: this page is the loader + USB serial.</p>
<input type="file" id="fw" accept=".hex,.bin">
<select id="preset" title="Built-in firmware proofs — run instantly, no file needed">
  <option value="">preset firmware…</option>
  <option value="blinky">blinky (UART BOOT/BLINK + GPIO)</option>
  <option value="sensors">sensors (buttons + TWIM + GPIOTE)</option>
  <option value="dma">dma (TWIM DMA loopback)</option>
  <option value="mpy">MicroPython v2.1.2 (built-in, auto-boots)</option>
</select>
<span id="status">loading wasm…</span> <span id="mips" title="Emulated instructions per wall-clock second"></span>
<div id="matrix"></div>
<div>
  <button id="btnA">A (P0.14)</button>
  <button id="btnB">B (P0.23)</button>
  <button id="reset">Reset</button>
  <button id="mpyboot" title="Boot the app at 0x1C000 with MBR params (see plan.md P16)">Boot MicroPython app</button>
</div>
<h2>Motion (LSM303)</h2>
<div>
  <label>Tilt X <input type="range" id="tiltX" min="-1000" max="1000" value="0"></label>
  <label>Tilt Y <input type="range" id="tiltY" min="-1000" max="1000" value="0"></label>
  <button id="shake">Shake</button>
</div>
<h2>OLED (SSD1306, edge I2C)</h2>
<canvas id="oled" style="width:256px;height:128px;background:#000"></canvas>
<h2>UART (UARTE0)</h2>
<textarea id="uart" readonly></textarea>
<div>
  <input type="text" id="uartIn" placeholder="type + Enter to send" style="width:80%">
  <button id="uartSend">Send</button>
</div>
<script type="module">
  import init, * as wasm from './pkg/nrf52833_periph_wasm.js';
  import { ROWS, COLS, INTERNAL } from './parts/pins.js';
  import { LSM303 } from './parts/lsm303.js';
  import { SSD1306 } from './parts/ssd1306.js';
  const grid = document.getElementById('matrix');
  const leds = [];
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    const d = document.createElement('div');
    d.className = 'led'; grid.appendChild(d); leds.push(d);
  }
  const uartBox = document.getElementById('uart');
  const uartIn = document.getElementById('uartIn');
  const status = document.getElementById('status');
  // Bytes typed by the user. Drip-fed one per consumed event (silicon
  // RXD holds a single byte; pushing faster would OVERRUN).
  const uartOut = [];
  function sendUart(text) {
    const enc = new TextEncoder().encode(text + '\r');
    for (const b of enc) uartOut.push(b);
    uartIn.value = '';
  }
  document.getElementById('uartSend').addEventListener('click', () => sendUart(uartIn.value));
  uartIn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendUart(uartIn.value);
  });
  // Tilt sliders drive the virtual accelerometer (mg).
  const tilt = { x: 0, y: 0 };
  for (const [id, k] of [['tiltX', 'x'], ['tiltY', 'y']]) {
    document.getElementById(id).addEventListener('input', (e) => {
      tilt[k] = parseInt(e.target.value, 10);
      parts[0].setAccel({ x: tilt.x, y: tilt.y, z: 1000 });
    });
  }
  document.getElementById('shake').addEventListener('click', () => parts[0].shake());

  await init();
  // Virtual board: parts register BEFORE every init() (taps snapshot once).
  const parts = [
    new LSM303(wasm, 'TWIM1'),
    new SSD1306(wasm, 'TWIM0', document.getElementById('oled')),
  ];
  function initBoard() {
    wasm.reset_state();
    for (const p of parts) p.register();
    wasm.init();
  }
  initBoard();
  status.textContent = 'wasm ready — drop firmware.';

  let cpu = null, boot = null;
  function parseHex(text) {
    // Minimal Intel HEX: data records, segment(02)/linear(04) addressing,
    // up to 512KB flash from base 0. UICR records (0x1000xxxx) are
    // collected separately (applied via periph_write after boot).
    const img = new Uint8Array(512 * 1024).fill(0xFF);
    const uicr = [];
    let base = 0, empty = true;
    for (const line of text.split(/\r?\n/)) {
      if (!line.startsWith(':')) continue;
      const n = parseInt(line.slice(1, 3), 16);
      const addr = parseInt(line.slice(3, 7), 16);
      const type = parseInt(line.slice(7, 9), 16);
      if (type === 4) { base = parseInt(line.slice(9, 13), 16) << 16; continue; }
      if (type === 2) { base = parseInt(line.slice(9, 13), 16) << 4; continue; }
      if (type !== 0) continue;
      for (let i = 0; i < n; i++) {
        const a = base + addr + i;
        const b = parseInt(line.slice(9 + i * 2, 11 + i * 2), 16);
        if (a >= 0x10000000 && a < 0x10002000) { uicr.push([a, b]); }
        else if (a < 0x80000) { img[a] = b; }
        empty = false;
      }
    }
    return empty ? null : { img, uicr };
  }
  // Pending UICR bytes from the last hex load (applied on boot).
  let pendingUicr = [];
  function applyUicr(uicr) {
    if (!uicr) return;
    const words = new Map();
    for (const [a, b] of uicr) {
      const w = a & ~3, i = a & 3;
      words.set(w, (words.get(w) || 0xFFFFFFFF) & ~(0xFF << (8 * i)) | (b << (8 * i)));
    }
    for (const [w, v] of words) wasm.periph_write(w, 4, v >>> 0);
  }
  // Built-in preset firmware (blinky/*.bin proofs, base64). Same boot
  // path as a dropped file: MBR vectors at 0x0, no UICR records.
  const PRESETS = {
    blinky: 'ACAAIAkAAABP8IBAASEBYBRICCEBYBRIT/QAEQFgE0gA8BP4AiQSSE/0ABEBYADwFfgQSE/0ABEBYADwD/gOSADwA/gBPO7R/ucQtQRGFPgBGxGxCUoRYPnnEL0ISgE6/dFwRwAlAEAYBQBQhAAAAAgFAFAMBQBQigAAABwlAEBADQMAQk9PVAoAQkxJTksKAA==',
    sensors: 'ACAAIAkAAABP8IBAASEBYBZICCEBYBZIFkkBYBZIBiEBYBZIGSEBYBVIASEBYBVIKCEBYBRIASEBYBRIAPAM+BNIAGgAKAPQEkgA8AX4AuARSADwAfj+5xC1BEYU+AEbEbEOShFg+ecQvQAAACUAQBBlAEABDgIAADUAQIg1AEAIMABAHDUAQBQwAECgAAAAAGEAQKkAAACwAAAAHCUAQFNFTlM6T0sKAEJUTjoxCgBCVE46MAoA',
    dma: 'ACAAIAkAAABP8IBAASEBYCJICCEBYCJIIkkBYCJIByEBYCJIASEBYCFIAPAl+CFIIUkBYCFIAyEBYCFIGSEBYCBIASEBYCBIAPAW+B9IAPAb+B9IH0kBYB9IASEBYB9IAWAfSAFgH0gBYB9IAPAE+B5IAPAJ+P7nBrUdSQJoACoB0QE5+tEGvRC1BEYU+AEbEbEYShFg+ecQvQAAACUAQEQlAED4AAAASCUAQAggAEAgIQBANDUAQAAQACA4NQBAiDUAQAAwAEAMMQBAAAEAACx2AEAQEAAgMHYAQAB1AEAAcABABHAAQARxAEAIAQAAQEIPABwlAEBETUE6T0sKAEkyQzpPSwoAQURDOk9LCgA=',
  };
  function bootPreset(name) {
    if (name === 'mpy') { bootPresetMicroPython(); return; }
    const b64 = PRESETS[name];
    if (!b64) return;
    bootImage(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)), []);
  }
  // Built-in MicroPython: shipped as demo/firmware/*.hex (same origin,
  // no CORS involved), then straight into the direct-app boot.
  async function bootPresetMicroPython() {
    status.textContent = 'loading built-in MicroPython…';
    try {
      const res = await fetch('./firmware/micropython-microbit-v2.1.2.hex');
      if (!res.ok) throw new Error('http ' + res.status);
      const parsed = parseHex(await res.text());
      if (!parsed) throw new Error('no data records');
      bootImage(parsed.img, parsed.uicr);
      bootMicroPythonApp();
    } catch (err) {
      status.textContent = 'built-in MicroPython failed to load: ' + err;
    }
  }
  document.getElementById('preset').addEventListener('change', (e) => {
    if (e.target.value) bootPreset(e.target.value);
  });
  // Live speedometer: emulated instructions per wall-clock second.
  let mipsN = 0, mipsT = performance.now();
  const mipsEl = document.getElementById('mips');
  // Direct-app boot target (e.g. MicroPython at 0x1C000): SYSRESETREQ
  // reboots must return here, not to the MBR vector table.
  let appBoot = null;
  function bootImage(u8, uicr) {
    const dv = new DataView(u8.buffer);
    const sp = dv.getUint32(0, true), pc = dv.getUint32(4, true);
    initBoard(); // re-register taps: reset_state() clears them
    pendingUicr = uicr || [];
    cpu = new wasm.WasmCpu(sp, pc, 512 * 1024, 128 * 1024);
    cpu.load_firmware(u8, 0);
    // Real firmware (SoftDevice, CODAL, MicroPython) uses SVCs and IRQs
    // throughout; without delivery the first SVC faults silently.
    cpu.set_deliver_irqs(true);
    // UICR (e.g. MicroPython BOOTLOADERADDR): pack bytes into words.
    applyUicr(uicr);
    boot = { sp, pc };
    appBoot = null;
    uartBox.value = '';
    mipsN = 0; mipsT = performance.now(); mipsEl.textContent = '';
    status.textContent = `running (SP=${sp.toString(16)} PC=${pc.toString(16)})`;
  }
  // MicroPython direct-app boot (plan.md P16 recipe): the stock hex's MBR
  // + bootloader reset-loop in emulation, so boot the app at 0x1C000 with
  // the MBR parameter page hand-installed (a real MBR->SD boot installs
  // these; our direct boot must do it by hand).
  function bootMicroPythonApp() {
    if (!cpu) { status.textContent = 'load a micro:bit MicroPython hex first'; return; }
    const w = (a) => cpu.read32(a);
    if (w(0x1C000) === 0xFFFFFFFF) { status.textContent = 'no app vector table at 0x1C000'; return; }
    // Start pristine (native-probe equivalent): the frames between hex
    // load and this click executed MBR/BL and left dirty model state
    // (timers/NVIC/RAM) that steers the app into the SVC-wait path;
    // native boots that banner run pristine. Re-init the model (the
    // firmware image stays loaded in WasmCpu memory), then re-apply
    // UICR + params + vectors.
    initBoard();
    applyUicr(pendingUicr);
    const u32 = (v) => { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, v, true); return b; };
    cpu.mem_write(0x20000000, u32(0x1000)); // MBR param: SoftDevice base
    cpu.mem_write(0x20000004, u32(0x1C000)); // MBR param: app base
    const sp = w(0x1C000), pc = w(0x1C004);
    // Sanity-gate the vectors: a preset/small image (or no image) leaves
    // 0x1C000 as 0x00000000, and reset_cpu(0, 0) would jump into the
    // weeds and fault obscurely (pc=60012100 class). Fail loudly instead.
    if (sp < 0x20000000 || sp > 0x20020000 || pc < 0x1C000 || pc >= 0x80000) {
      status.textContent = `no valid MicroPython app at 0x1C000 (SP=${(sp >>> 0).toString(16)} PC=${(pc >>> 0).toString(16)}) — load its .hex first`;
      return;
    }
    cpu.reset_cpu(sp, pc);
    boot = { sp, pc };
    appBoot = { sp, pc };
    uartBox.value = '';
    status.textContent = `MicroPython app boot (SP=${sp.toString(16)} PC=${pc.toString(16)}), banner follows`;
  }
  document.getElementById('fw').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const buf = await f.arrayBuffer();
    let img = null; pendingUicr = [];
    if (f.name.endsWith('.hex')) {
      const parsed = parseHex(new TextDecoder().decode(buf));
      if (!parsed) { status.textContent = 'no data records in hex'; return; }
      img = parsed.img; pendingUicr = parsed.uicr;
    } else {
      img = new Uint8Array(buf);
    }
    bootImage(img, pendingUicr);
  });
  document.getElementById('reset').addEventListener('click', () => {
    if (cpu && boot) {
      cpu.reset_cpu(boot.sp, boot.pc);
      uartBox.value = '';
      status.textContent = 'reset';
    }
  });
  document.getElementById('mpyboot').addEventListener('click', bootMicroPythonApp);
  for (const [id, port, pin] of [['btnA', ...INTERNAL.BTN_A], ['btnB', ...INTERNAL.BTN_B]]) {
    const b = document.getElementById(id);
    // Buttons are active-low with pull-ups: released=true, pressed=false.
    b.addEventListener('pointerdown', () => wasm.gpio_set_input(port, pin, false));
    b.addEventListener('pointerup', () => wasm.gpio_set_input(port, pin, true));
    b.addEventListener('pointerleave', () => wasm.gpio_set_input(port, pin, true));
  }
  // EASYDMA pump: move staged transfers between guest RAM and hosts.
  // Last looped-back air packet (radio RX delivery needs the bytes).
  let lastAir = [];
  function pumpDma() {
    if (!cpu) return;
    if (wasm.is_watchdog_reset_requested()) {
      // Firmware asked for a reboot (e.g. MicroPython's MBR/SD handoff):
      // reload SP/PC from the vector table like the native test driver --
      // or from the app table after a direct-app boot (else we lose the
      // app back to the MBR/bootloader loop).
      const b = appBoot || boot;
      cpu.reset_cpu(b.sp, b.pc);
      return;
    }
    let t = wasm.uarte_take_txdma();
    if (t.length) {
      const bytes = cpu.mem_read(t[0], t[1]);
      wasm.uarte_complete_txdma(bytes);
    }
    // NOTE: no uarte_take_rxdma block here on purpose. RX bytes are
    // dripped one per consumed RXDRDY below (frame): bulk-completing a
    // staged 32B DMA transfer early fires ENDRX with no firmware re-arm
    // and input stalls forever. The drip mirrors each byte into the DMA
    // buffer too, so DMA-mode firmware (MicroPython) sees real data.
    // I2C buses are owned by virtual parts (see below), not the generic pump.
    for (const name of ['SPIM2', 'SPIM3']) {
      t = wasm.twim_take_txdma(name);
      if (t.length) {
        const bytes = cpu.mem_read(t[1], t[2]);
        wasm.twim_complete_txdma(name, bytes);
      }
      t = wasm.twim_take_rxdma(name);
      if (t.length) {
        const fill = new Uint8Array(t[2]).fill(0xFF);
        cpu.mem_write(t[1], fill);
        wasm.twim_complete_rxdma(name, t[2]);
      }
    }
    // I2C buses are owned by virtual parts (not the generic pump):
    // TWIM1 = LSM303 motion sensor, TWIM0 = SSD1306 OLED (edge).
    for (const p of parts) p.poll(cpu);
    t = wasm.saadc_take_result();
    if (t.length) {
      const fill = new Uint8Array(t[1] * 2).fill(0x80);
      cpu.mem_write(t[0], fill);
      wasm.saadc_complete_result(t[1]);
    }
    t = wasm.pdm_take_sample();
    if (t.length) {
      const fill = new Uint8Array(t[1] * 2);
      cpu.mem_write(t[0], fill);
      wasm.pdm_complete_sample();
    }
    // I2S audio streaming: RX gets silence, TX bytes go to the capture
    // FIFO (drained below; TODO: route to WebAudio for real playback).
    t = wasm.i2s_take_rx();
    if (t.length) {
      cpu.mem_write(t[0], new Uint8Array(t[1]));
      wasm.i2s_complete_rx();
    }
    t = wasm.i2s_take_tx();
    if (t.length) {
      const bytes = cpu.mem_read(t[0], t[1]);
      wasm.i2s_complete_tx(bytes);
    }
    if (wasm.i2s_take_capture().length) { /* drained; see TODO above */ }
    // USB device: complete staged endpoints so enumeration proceeds.
    t = wasm.usbd_take_epin();
    if (t.length) {
      const bytes = cpu.mem_read(t[1], t[2]);
      wasm.usbd_complete_epin(t[0], bytes);
    }
    t = wasm.usbd_take_epout();
    if (t.length) {
      const fill = new Uint8Array(t[2]);
      cpu.mem_write(t[1], fill);
      wasm.usbd_complete_epout(t[0], t[2]);
    }
    // NVMC: apply staged erases to guest flash (0xFF), then complete.
    t = wasm.nvmc_take_erase();
    if (t.length) {
      if (t[0] === 0xFFFFFFFF) {
        cpu.mem_write(0, new Uint8Array(512 * 1024).fill(0xFF));
      } else {
        cpu.mem_write(t[0], new Uint8Array(4096).fill(0xFF));
      }
      wasm.nvmc_complete_erase();
    }
    t = wasm.radio_take_tx();
    if (t.length) {
      // Demo air: loop straight back into the RX queue, complete TX,
      // and deliver the queued bytes to the staged RX buffer.
      const bytes = cpu.mem_read(t[0], t[1]);
      lastAir = bytes;
      wasm.radio_inject_rx(bytes);
      wasm.radio_complete_tx();
    }
    t = wasm.radio_take_rx();
    if (t.length && lastAir.length) {
      // Loopback: the last injected packet lands in the RX buffer.
      // (A real air layer would supply foreign bytes here instead.)
      cpu.mem_write(t[0], lastAir.slice(0, 252));
      lastAir = [];
      wasm.radio_complete_rx();
    }
  }
  function frame() {
    if (cpu) {
      // Throughput: several 20K step+tick slices per frame (100K), duties
      // once. Single-slice frames cap at ~60fps*20K (vsync-bound); batching
      // raises wall throughput ~2-3x with unchanged 20K tick granularity.
      for (let k = 0; k < 5; k++) {
        mipsN += cpu.step(20000);
        wasm.tick_peripherals();
        if (cpu.fault_pc() !== 0xFFFFFFFF) break;
        if (cpu.sleeping()) {
          // Firmware idles in WFE/WFI (the MicroPython scheduler does this
          // constantly): advance virtual time so a future peripheral IRQ
          // can pend, then wake on one. Without this the core naps forever
          // the first time it idles (found via MicroPython REPL bring-up).
          wasm.tick_n(20000);
          if (wasm.has_pending_interrupt()) cpu.wake();
        }
      }
      const fpc = cpu.fault_pc();
      if (fpc !== 0xFFFFFFFF) {
        status.textContent = `CPU fault pc=${(fpc >>> 0).toString(16)} op=${cpu.fault_op1().toString(16)} (see console-style UART above)`;
      }
      pumpDma();
      // Drip one typed byte per consumed RXDRDY (see above). The byte is
      // mirrored into the DMA buffer (RXD.PTR+AMOUNT) so DMA-mode firmware
      // (MicroPython reads exclusively from that ring) receives it too.
      if (uartOut.length && wasm.periph_read(0x40002108, 4) === 0) {
        const b = uartOut.shift();
        const ptr = wasm.periph_read(0x40002534, 4), amt = wasm.periph_read(0x4000253C, 4);
        if (ptr >= 0x20000000 && amt < 4096) cpu.mem_write(ptr + amt, new Uint8Array([b]));
        wasm.uart_rx_byte(0x40002000, b);
      }
      const out = wasm.get_uart_output();
      if (out) uartBox.value += out;
      const now = performance.now();
      if (now - mipsT > 500) {
        mipsEl.textContent = `${(mipsN / (now - mipsT) / 1000).toFixed(2)} MIPS`;
        mipsN = 0; mipsT = now;
      }
      // LEDs need DIR=output on silicon: a toggling OUT latch on an input
      // pin (e.g. display refresh before first show) must stay dark.
      const dir0 = wasm.periph_read(0x50000514, 4), dir1 = wasm.periph_read(0x50000814, 4);
      const isOut = ([port, pin]) => (((port ? dir1 : dir0) >>> pin) & 1) !== 0;
      for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
        const row = wasm.gpio_read_output(ROWS[r][0], ROWS[r][1]);
        const col = wasm.gpio_read_output(COLS[c][0], COLS[c][1]);
        leds[r * 5 + c].classList.toggle('on', isOut(ROWS[r]) && !row && isOut(COLS[c]) && col);
      }
    }
  requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
