<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>micro:bit v2.2 emulator (nRF52833)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  #matrix { display: grid; grid-template-columns: repeat(5, 44px); gap: 6px; margin: 1rem 0; }
  .led { width: 44px; height: 44px; border-radius: 6px; background: #222; }
  .led.on { background: #f00; box-shadow: 0 0 12px #f00; }
  button { font-size: 1rem; margin-right: .5rem; }
  #uart { width: 100%; height: 140px; font-family: monospace; }
  #status { color: #555; }
</style>
</head>
<body>
<h1>micro:bit v2.2 emulator <small>(nRF52833 target only)</small></h1>
<p>Drop a <code>.hex/.bin</code> built for flash <code>0x0</code> (ARM GCC, no SoftDevice).
Interface MCU (DAPLink) is <em>not</em> emulated: this page is the loader + USB serial.</p>
<input type="file" id="fw" accept=".hex,.bin">
<span id="status">loading wasm…</span>
<div id="matrix"></div>
<div>
  <button id="btnA">A (P0.14)</button>
  <button id="btnB">B (P0.23)</button>
  <button id="reset">Reset</button>
</div>
<h2>UART (UARTE0)</h2>
<textarea id="uart" readonly></textarea>
<div>
  <input type="text" id="uartIn" placeholder="type + Enter to send" style="width:80%">
  <button id="uartSend">Send</button>
</div>
<script type="module">
  import init, * as wasm from './pkg/nrf52833_periph_wasm.js';

  // Wiring map (micro:bit v2 schematic, rows sink / cols source):
  const ROWS = [[0,21],[0,22],[0,15],[0,24],[0,19]];
  const COLS = [[0,28],[0,11],[0,31],[1,5],[0,30]];
  const grid = document.getElementById('matrix');
  const leds = [];
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    const d = document.createElement('div');
    d.className = 'led'; grid.appendChild(d); leds.push(d);
  }
  const uartBox = document.getElementById('uart');
  const uartIn = document.getElementById('uartIn');
  const status = document.getElementById('status');
  // Bytes typed by the user. Drip-fed one per consumed event (silicon
  // RXD holds a single byte; pushing faster would OVERRUN).
  const uartOut = [];
  function sendUart(text) {
    const enc = new TextEncoder().encode(text + '\r');
    for (const b of enc) uartOut.push(b);
    uartIn.value = '';
  }
  document.getElementById('uartSend').addEventListener('click', () => sendUart(uartIn.value));
  uartIn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendUart(uartIn.value);
  });

  await init();
  wasm.reset_state();
  wasm.init();
  status.textContent = 'wasm ready — drop firmware.';

  let cpu = null, boot = null;
  function parseHex(text) {
    // Minimal Intel HEX: data records only, up to 512KB from base 0.
    const img = new Uint8Array(512 * 1024);
    let high = 0, empty = true;
    for (const line of text.split(/\r?\n/)) {
      if (!line.startsWith(':')) continue;
      const n = parseInt(line.slice(1, 3), 16);
      const addr = parseInt(line.slice(3, 7), 16);
      const type = parseInt(line.slice(7, 9), 16);
      if (type === 4) { high = parseInt(line.slice(9, 13), 16) << 16; continue; }
      if (type !== 0) continue;
      for (let i = 0; i < n; i++) {
        const a = (high + addr + i) & 0x7FFFF;
        img[a] = parseInt(line.slice(9 + i * 2, 11 + i * 2), 16);
        empty = false;
      }
    }
    return empty ? null : img;
  }
  function bootImage(u8) {
    const dv = new DataView(u8.buffer);
    const sp = dv.getUint32(0, true), pc = dv.getUint32(4, true);
    wasm.reset_state();
    wasm.init();
    cpu = new wasm.WasmCpu(sp, pc, 512 * 1024, 128 * 1024);
    cpu.load_firmware(u8, 0);
    boot = { sp, pc };
    uartBox.value = '';
    status.textContent = `running (SP=${sp.toString(16)} PC=${pc.toString(16)})`;
  }
  document.getElementById('fw').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const buf = await f.arrayBuffer();
    let img = null;
    if (f.name.endsWith('.hex')) {
      img = parseHex(new TextDecoder().decode(buf));
      if (!img) { status.textContent = 'no data records in hex'; return; }
    } else {
      img = new Uint8Array(buf);
    }
    bootImage(img);
  });
  document.getElementById('reset').addEventListener('click', () => {
    if (cpu && boot) {
      cpu.reset_cpu(boot.sp, boot.pc);
      uartBox.value = '';
      status.textContent = 'reset';
    }
  });
  for (const [id, port, pin] of [['btnA', 0, 14], ['btnB', 0, 23]]) {
    const b = document.getElementById(id);
    b.addEventListener('pointerdown', () => wasm.gpio_set_input(port, pin, true));
    b.addEventListener('pointerup', () => wasm.gpio_set_input(port, pin, false));
    b.addEventListener('pointerleave', () => wasm.gpio_set_input(port, pin, false));
  }
  // EASYDMA pump: move staged transfers between guest RAM and hosts.
  function pumpDma() {
    if (!cpu) return;
    if (wasm.is_watchdog_reset_requested()) {
      // Firmware asked for a reboot (e.g. MicroPython's MBR/SD handoff):
      // reload SP/PC from the vector table like the native test driver.
      cpu.reset_cpu(cpu.read32(0), cpu.read32(4));
      return;
    }
    let t = wasm.uarte_take_txdma();
    if (t.length) {
      const bytes = cpu.mem_read(t[0], t[1]);
      wasm.uarte_complete_txdma(bytes);
    }
    t = wasm.uarte_take_rxdma();
    if (t.length) {
      // Serve typed bytes first, zero-fill the rest.
      const n = Math.min(t[1], uartOut.length);
      const fill = new Uint8Array(t[1]);
      for (let i = 0; i < n; i++) fill[i] = uartOut.shift();
      cpu.mem_write(t[0], fill);
      wasm.uarte_complete_rxdma(n);
    }
    for (const name of ['TWIM0', 'TWIM1']) {
      t = wasm.twim_take_txdma(name);
      if (t.length) {
        const bytes = cpu.mem_read(t[1], t[2]);
        wasm.twim_complete_txdma(name, bytes);
      }
      t = wasm.twim_take_rxdma(name);
      if (t.length) {
        // No slave model bound in the demo: complete with 0xFF fill.
        const fill = new Uint8Array(t[2]).fill(0xFF);
        cpu.mem_write(t[1], fill);
        wasm.twim_complete_rxdma(name, t[2]);
      }
    }
    for (const name of ['SPIM2', 'SPIM3']) {
      t = wasm.twim_take_txdma(name);
      if (t.length) {
        const bytes = cpu.mem_read(t[1], t[2]);
        wasm.twim_complete_txdma(name, bytes);
      }
      t = wasm.twim_take_rxdma(name);
      if (t.length) {
        const fill = new Uint8Array(t[2]).fill(0xFF);
        cpu.mem_write(t[1], fill);
        wasm.twim_complete_rxdma(name, t[2]);
      }
    }
    t = wasm.saadc_take_result();
    if (t.length) {
      const fill = new Uint8Array(t[1] * 2).fill(0x80);
      cpu.mem_write(t[0], fill);
      wasm.saadc_complete_result(t[1]);
    }
    t = wasm.pdm_take_sample();
    if (t.length) {
      const fill = new Uint8Array(t[1] * 2);
      cpu.mem_write(t[0], fill);
      wasm.pdm_complete_sample();
    }
    // USB device: complete staged endpoints so enumeration proceeds.
    t = wasm.usbd_take_epin();
    if (t.length) {
      const bytes = cpu.mem_read(t[1], t[2]);
      wasm.usbd_complete_epin(t[0], bytes);
    }
    t = wasm.usbd_take_epout();
    if (t.length) {
      const fill = new Uint8Array(t[2]);
      cpu.mem_write(t[1], fill);
      wasm.usbd_complete_epout(t[0], t[2]);
    }
    // NVMC: apply staged erases to guest flash (0xFF), then complete.
    t = wasm.nvmc_take_erase();
    if (t.length) {
      if (t[0] === 0xFFFFFFFF) {
        cpu.mem_write(0, new Uint8Array(512 * 1024).fill(0xFF));
      } else {
        cpu.mem_write(t[0], new Uint8Array(4096).fill(0xFF));
      }
      wasm.nvmc_complete_erase();
    }
    t = wasm.radio_take_tx();
    if (t.length) {
      // Demo air: loop straight back.
      const bytes = cpu.mem_read(t[0], 8);
      wasm.radio_inject_rx(bytes);
    }
  }
  function frame() {
    if (cpu) {
      cpu.step(20000);
      wasm.tick_peripherals();
      pumpDma();
      // Drip one typed byte per consumed RXDRDY (see above).
      if (uartOut.length && wasm.periph_read(0x40002108, 4) === 0) {
        wasm.uart_rx_byte(0x40002000, uartOut.shift());
      }
      const out = wasm.get_uart_output();
      if (out) uartBox.value += out;
      for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
        const row = wasm.gpio_read_output(ROWS[r][0], ROWS[r][1]);
        const col = wasm.gpio_read_output(COLS[c][0], COLS[c][1]);
        leds[r * 5 + c].classList.toggle('on', !row && col);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
